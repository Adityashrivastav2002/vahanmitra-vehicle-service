server:
  port: 8080

spring:
  application:
    name: vahanmitra-api
  datasource:
    url: jdbc:h2:file:./data/vahanmitra;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origin: http://localhost:5173
